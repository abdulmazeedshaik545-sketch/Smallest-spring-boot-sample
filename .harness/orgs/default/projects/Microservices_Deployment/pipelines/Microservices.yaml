pipeline:
  stages:
    - id: javaMavenBuildTestHostedLinuxStage_1
      name: Java Maven Build and Test on Harness Cloud (Linux)
      clone:
        enabled: true
      cache:
        enabled: true
      build-intelligence:
        enabled: true
      steps:
        - id: setupJava
          name: Setup Java
          template:
            uses: setupJava@1.0.0
        - id: buildLinux
          name: Build on Linux
          run:
            shell: bash
            script: |-
              mvn -B -f SmallestSpringApp/pom.xml -DskipTests package
        - id: testLinux
          name: Test on Linux
          run-test:
            shell: bash
            script: |-
              mvn -f SmallestSpringApp/pom.xml test
            intelligence:
              disabled: true
        - id: checkDockerfile
          name: Check Dockerfile and Build Output
          run:
            shell: bash
            script: |-
              echo "Current directory:"
              pwd
              echo "Repository root:"
              ls -la
              echo "Application directory:"
              ls -la SmallestSpringApp
              echo "Dockerfile check:"
              test -f SmallestSpringApp/Dockerfile && echo "Dockerfile FOUND" || echo "Dockerfile MISSING"
              echo "Maven build output:"
              ls -la SmallestSpringApp/target || true
        - name: Dockethub
          id: Dockethub
          build:
            uses: buildAndPushToDocker
            with:
              connector: account.Docketconnector
              repo: abdulmazeedshaik545-sketch/smallest-spring-app
              tags:
                - SmallestSpringApp
              caching: true
              context: SmallestSpringApp
              dockerfile: Dockerfile

       
