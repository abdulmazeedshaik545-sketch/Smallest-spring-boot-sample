pipeline:
  stages:
    - id: javaMavenBuildTestHostedLinuxStage_1
      name: Java Maven Build and Test on Harness Cloud (Linux)
      clone:
        enabled: true
      cache:
        enabled: true
      build-intelligence:
        enabled: true
      steps:
        - id: setupJava
          name: Setup Java
          template:
            uses: setupJava@1.0.0
        - id: buildLinux
          name: Build on Linux
          run:
            shell: bash
            script: |-
              mvn -B -f SmallestSpringApp/pom.xml -DskipTests package
        - id: testLinux
          name: Test on Linux
          run-test:
            shell: bash
            script: |-
              mvn -f SmallestSpringApp/pom.xml test
            intelligence:
              disabled: true

        - id: checkDockerfile
          name: Verify Dockerfile
          run:
            shell: bash
            script: |-
              pwd
              ls -la
              ls -la SmallestSpringApp
              wc -c SmallestSpringApp/Dockerfile
              cat SmallestSpringApp/Dockerfile
              ls -la SmallestSpringApp/target

        - name: Dockethub
          id: Dockethub
          build:
            uses: buildAndPushToDocker
            with:
              connector: account.Docketconnector
              repo: abdulmazeed545/smallest-spring-app
              tags:
                - SmallestSpringApp
              caching: true
              context: .
              dockerfile: SmallestSpringApp/Dockerfile
    - name: Deploy Kubernetes_bc85
      id: Deploy_Kubernetes_bc85
      service:
        type: kubernetes
        items:
          - SmallestSpringApp_Service
      environment:
        items:
          - id: Microservices_Dev
            all-infra: true
            deploy-to: Microservices_Dev
      steps:
        - name: Kubernetes Canary Deploy
          id: k8sCanaryDeployStep
          template:
            uses: k8sCanaryDeployStep
        - name: Kubernetes Canary Delete
          id: k8sCanaryDeleteStep
          template:
            uses: k8sCanaryDeleteStep
            with:
              resources: ${{stage.steps.k8sCanaryDeployStep.output.outputVariables.canaryWorkloads}}
              is_openshift: ${{stage.steps.k8sCanaryDeployStep.output.outputVariables.isOpenshift}}
        - name: Kubernetes Rolling Deploy
          id: k8sRollingDeployStep
          template:
            uses: k8sRollingDeployStep
      rollback:
        - group:
            steps:
              - name: Kubernetes Canary Rollback Delete
                id: k8sCanaryRollbackDeleteStep
                template:
                  uses: k8sCanaryDeleteStep
                  with:
                    select_delete_resources: resources
                    resources: ${{rollback.data.PLUGIN_CANARY_WORKLOADS}}
                    is_openshift: ${{rollback.data.HARNESS_IS_OPENSHIFT}}
              - name: Kubernetes Rolling Rollback
                id: k8sRollingRollbackStep
                template:
                  uses: k8sRollingRollbackStep
          id: k8sCanaryRollback
          name: Kubernetes Canary Rollback
      on-failure:
        errors: all
        action: stage-rollback
      runtime: cloud
