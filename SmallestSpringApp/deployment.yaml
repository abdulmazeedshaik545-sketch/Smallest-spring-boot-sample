
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smallest-spring-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smallest-spring-app
  template:
    metadata:
      labels:
        app: smallest-spring-app
    spec:
      containers:
        - name: smallest-spring-app
          image: abdulmazeed545/smallest-spring-app:SmallestSpringApp
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
            value: "--add-opens=java.base/java.lang=ALL-UNNAMED"
---
apiVersion: v1
kind: Service
metadata:
  name: smallest-spring-app-service
spec:
  selector:
    app: smallest-spring-app
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
